Here is how you can generate the Android .apk file for your MyOwnNovels project:  
MD
+ 1

Option 1: Build via GitHub Actions (No local Android Studio needed)
Upload all your project files (including settings.gradle.kts, build.gradle.kts, gradle.properties, and the app/ directory) to the root of a GitHub repository.  
MD

Create a folder structure in your repository: .github/workflows/.  
MD

Inside .github/workflows/, create a file named build.yml with the following configuration:

YAML
name: Build MyOwnNovels APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyOwnNovels-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
